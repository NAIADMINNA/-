    <meta property="og:title" content="To Do List Calendar + LINE Reminder" />

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Gracefully prevent unhandled rejection & console error noise for Vite HMR WebSocket in cloud preview environment
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (event.reason.message?.includes('WebSocket') || String(event.reason).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && event.message.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
